<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pair WebLock</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0F172A; color: #fff;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px;
            max-width: 360px; width: 90%; text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
    p { color: #94a3b8; margin: 0 0 1.5rem; font-size: .9rem; }
    input { width: 100%; box-sizing: border-box; padding: .9rem;
            font-size: 1.5rem; text-align: center; letter-spacing: .4em;
            border: 1px solid #334155; border-radius: 8px;
            background: #0F172A; color: #fff; margin-bottom: 1rem; }
    button { width: 100%; padding: .9rem; font-size: 1rem; font-weight: 600;
             border: 0; border-radius: 8px; background: #3B82F6; color: #fff;
             cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .status { margin-top: 1rem; font-size: .9rem; min-height: 1.2em; }
    .ok { color: #4ade80; } .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pair this browser</h1>
    <p>Enter the 6-digit code from your WebLock dashboard.</p>
    <input id="code" maxlength="6" inputmode="numeric" placeholder="000000" autofocus />
    <button id="go">Pair device</button>
    <div id="status" class="status"></div>
  </div>
  <script src="pair.js"></script>
</body>
</html>
